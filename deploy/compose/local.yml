name: peergit-local
services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: peergit
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: peergit
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peergit -d peergit"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g

  pgadmin:
    image: dpage/pgadmin4:9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@peergit.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-only-pgadmin}
    ports: ["127.0.0.1:5050:80"]
    volumes: ["pgadmin-data:/var/lib/pgadmin"]
    depends_on:
      postgres:
        condition: service_healthy

  objects:
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: local-object-access
      AWS_SECRET_ACCESS_KEY: local-object-secret
      S3_BUCKET: peergit-local
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["object-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 2g

  mailpit:
    image: axllent/mailpit@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  forgejo:
    image: data.forgejo.org/forgejo/forgejo:15.0.12-rootless@sha256:b670d7724274e1d5c7801b76017b7267e6e5432aa4fe8bed49f781d09476b9dd
    profiles: [pbl]
    environment:
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: "127.0.0.1/32,::1/128"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__service__ENABLE_REVERSE_PROXY_AUTHENTICATION: "false"
      FORGEJO__repository__FORCE_PRIVATE: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "false"
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "false"
      FORGEJO__repository__DISABLE_HTTP_GIT: "false"
      FORGEJO__actions__ENABLED: "false"
      FORGEJO__packages__ENABLED: "false"
      FORGEJO__webhook__ALLOWED_HOST_LIST: host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${PEERGIT_FORGEJO_PORT:-3031}:3000"]
    volumes: ["forgejo-data:/var/lib/gitea", "forgejo-config:/etc/gitea"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 768m

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
  object-data:
  caddy-data:
  caddy-config:
  forgejo-data:
  forgejo-config:
