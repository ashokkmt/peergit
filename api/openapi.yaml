  /api/v1/academic/pbl/teams/{team}/checkpoints/{stage}:
    parameters:
      - { in: path, name: team, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: stage, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
    post:
      operationId: submitPBLCheckpoint
      summary: Pin a previously pushed SHA and record an immutable receipt
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PBLCheckpoint' }
      responses:
        '201': { description: Recorded }
        '200': { description: The existing receipt for the same SHA }
        '403': { description: The requested action is forbidden }
        '404': { description: The resource is unavailable to this user }
        '409': { description: The action conflicts with the current state }
    put:
      operationId: reviewPBLCheckpoint
      summary: Record assigned faculty checkpoint feedback
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PBLFeedback' }
      responses:
        '200': { description: Success }
        '403': { description: The requested action is forbidden }
        '404': { description: The resource is unavailable to this user }
        '409': { description: The action conflicts with the current state }
  /api/v1/academic/pbl/teams/{team}/checkpoints/{stage}/retry:
    parameters:
      - { in: path, name: team, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: stage, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
    post:
      operationId: retryPBLCheckpoint
      summary: Retry a failed capture using the original receipt and SHA
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': { description: Success }
        '403': { description: The requested action is forbidden }
        '404': { description: The resource is unavailable to this user }
        '409': { description: The action conflicts with the current state }
  /api/v1/academic/pbl/teams/{team}/checkpoints/{stage}/download:
    parameters:
      - { in: path, name: team, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: stage, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
    get:
      operationId: downloadPBLCheckpoint
      summary: Download an authorized immutable checkpoint archive
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Success }
        '403': { description: The requested action is forbidden }
        '404': { description: The resource is unavailable to this user }
  /api/v1/pbl/git/{repository}/info/refs:
    get:
      operationId: advertisePBLGitRefs
      summary: Advertise Git refs over the scoped PBL HTTPS remote
      security: [{ pblGitCredential: [] }]
      parameters:
        - { in: path, name: repository, required: true, schema: { type: string, description: PBL team UUID followed by .git } }
        - { in: query, name: service, required: true, schema: { type: string, enum: [git-upload-pack, git-receive-pack] } }
      responses:
        '200': { description: Smart HTTP ref advertisement }
        '401': { description: A current scoped credential is required }
  /api/v1/pbl/git/{repository}/git-upload-pack:
    post:
      operationId: fetchPBLGit
      summary: Clone or fetch from the private PBL Git remote
      security: [{ pblGitCredential: [] }]
      parameters:
        - { in: path, name: repository, required: true, schema: { type: string } }
      responses:
        '200': { description: Git upload-pack result }
        '401': { description: A current scoped credential is required }
  /api/v1/pbl/git/{repository}/git-receive-pack:
    post:
      operationId: pushPBLGit
      summary: Push to the team remote with Git ref and project limits
      security: [{ pblGitCredential: [] }]
      parameters:
        - { in: path, name: repository, required: true, schema: { type: string } }
      responses:
        '200': { description: Git receive-pack result }
        '401': { description: A current scoped credential is required }
        '403': { description: The requested branch update is protected }
        '413': { description: The pack or repository exceeds its pilot limit }
  /api/v1/pbl/forgejo/webhooks:
    post:
      operationId: receivePBLForgejoWebhook
      summary: Accept an authenticated Forgejo event with replay deduplication
      parameters:
        - { in: header, name: X-Forgejo-Signature, required: true, schema: { type: string } }
        - { in: header, name: X-Forgejo-Delivery, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Accepted or already seen }
        '401': { description: Invalid signature }
components:
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  securitySchemes:
    pblGitCredential:
      type: http
      scheme: basic
      description: Team-scoped temporary Git credential issued in the PBL workspace
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-peergit_session
  schemas:
    PBLOffering:
      type: object
      required: [course_id, term_id, closes_at, phase_one_due, phase_two_due, phase_three_due]
      properties:
        course_id: { type: string, format: uuid }
        term_id: { type: string, format: uuid }
        closes_at: { type: string, format: date-time }
        phase_one_due: { type: string, format: date-time }
        phase_two_due: { type: string, format: date-time }
        phase_three_due: { type: string, format: date-time }
    PBLTeam:
      type: object
      required: [title, members]
      properties:
        title: { type: string, maxLength: 120 }
        members: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/PBLTeamMember' } }
    PBLTeamMember:
      type: object
      required: [name, roll_number, section]
      properties:
        name: { type: string, maxLength: 120 }
        roll_number: { type: string, maxLength: 40, writeOnly: true }
        section: { type: string, maxLength: 40 }
    PBLRoster:
      type: object
      required: [matches]
      properties:
        matches: { type: array, maxItems: 12, items: { type: object, required: [entry_id, handle], properties: { entry_id: { type: string, format: uuid }, handle: { type: string } } } }
    PBLFaculty:
      type: object
      required: [faculty_id]
      properties:
        faculty_id: { type: string, format: uuid }
    PBLIdea:
      type: object
      required: [idea]
      properties:
        idea: { type: string, maxLength: 4000 }
    PBLIdeaReview:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, revise] }
        feedback: { type: string, maxLength: 2000 }
    PBLAttendance:
      type: object
      required: [student_id, stage, present]
      properties:
        student_id: { type: string, format: uuid }
        stage: { type: integer, minimum: 0, maximum: 3 }
        present: { type: boolean }
    PBLProvision:
      type: object
      properties:
        installation_id: { type: string, format: uuid }
        repository_id: { type: integer, format: int64, minimum: 1 }
    PBLCard:
      type: object
      required: [visible]
      properties:
        visible: { type: boolean }
    PBLCheckpoint:
      type: object
      required: [sha]
      properties:
        sha: { type: string, pattern: '^[0-9a-f]{40}$' }
    PBLFeedback:
      type: object
      required: [feedback]
      properties:
        feedback: { type: string, maxLength: 2000 }
    PBLWork:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [issue, comment, issue_state, label, pull, review, merge] }
        number: { type: integer, format: int64, minimum: 1 }
        title: { type: string, maxLength: 160 }
        body: { type: string, maxLength: 8000 }
        head: { type: string, maxLength: 200 }
        sha: { type: string, pattern: '^[0-9a-f]{40}$' }
        member: { type: string, format: uuid }
        decision: { type: string, enum: [open, closed, APPROVED, REQUEST_CHANGES, COMMENT] }
        labels: { type: array, maxItems: 10, items: { type: integer, format: int64, minimum: 1 } }
    AcademicProfile:
      type: object
      properties:
        course_of_study: { type: [string, 'null'], maxLength: 120 }
        year: { type: [integer, 'null'], minimum: 1, maximum: 12 }
        semester: { type: [integer, 'null'], minimum: 1, maximum: 24 }
        section: { type: [string, 'null'], maxLength: 40 }
    ProjectCreate:
      type: object
      required: [slug, title, summary]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', minLength: 2, maxLength: 80 }
        title: { type: string, minLength: 3, maxLength: 120 }
        summary: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 12000 }
        project_type: { type: string, enum: [side_project, coursework, research, startup, open_source, hackathon] }
        visibility: { type: string, enum: [private, campus, public] }
        lifecycle: { type: string, enum: [draft, active, on_hold, completed, archived] }
        skills: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 80 } }
        media_ids: { type: array, maxItems: 10, items: { type: string, format: uuid } }
    ProjectUpdate:
      type: object
      required: [summary, description, visibility, lifecycle, version]
      properties:
        summary: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, maxLength: 12000 }
        visibility: { type: string, enum: [private, campus, public] }
        lifecycle: { type: string, enum: [draft, active, on_hold, completed, archived] }
        version: { type: integer, minimum: 1 }
    ProjectRoleCreate:
      type: object
      required: [title, description, openings]
      properties:
        title: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, minLength: 1, maxLength: 3000 }
        openings: { type: integer, minimum: 1, maximum: 20 }
        difficulty: { type: string, enum: [novice, beginner, intermediate, advanced] }
        good_first_task: { type: boolean }
        prerequisite_skills: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
    ProjectApplicationCreate:
      type: object
      required: [role_id, message]
      properties:
        role_id: { type: string, format: uuid }
        message: { type: string, minLength: 1, maxLength: 2000 }
    ProfileUpdate:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        headline: { type: string, maxLength: 160 }
        bio: { type: string, maxLength: 2000 }
        avatar_media_id: { type: string, format: uuid }
        academic: { $ref: '#/components/schemas/AcademicProfile' }
        skills: { type: array, maxItems: 30, items: { type: string, minLength: 2, maxLength: 60 } }
    ConsentUpdate:
      type: object
      required: [purpose, policy_version, granted]
      properties:
        purpose: { type: string, enum: [terms, privacy, profile_discovery, portfolio, analytics] }
        policy_version: { type: string, maxLength: 40 }
        granted: { type: boolean }
    MfaCode:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 32 }
    InvitationCreate:
      type: object
      required: [email, account_type]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        account_type: { type: string, enum: [campus, external] }
        role: { type: string, enum: [student, faculty, alumni_mentor, moderator] }
        external_access_kind: { type: string, enum: [mentor, organization_guest] }
        organization_id: { type: string, format: uuid }
        expires_hours: { type: integer, minimum: 1, maximum: 168, default: 72 }
    OrganizationCreate:
      type: object
      required: [kind, slug, name]
      properties:
        kind: { type: string, enum: [department, club, innovation_cell, event_body] }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', minLength: 2, maxLength: 80 }
        name: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
    RoleGrant:
      type: object
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [student, faculty, alumni_mentor, moderator] }
    SuccessEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string }
        request_id: { type: string }
        error: { type: 'null' }
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        data: { type: 'null' }
        request_id: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
